{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | FarmBright</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Background with sunrise effect */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8ffae, #43c6ac);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* Floating leaves animation */
    .leaf {
      position: absolute;
      width: 25px;
      height: 25px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/415/415733.png');
      background-size: cover;
      opacity: 0.6;
      animation: fall linear infinite;
      z-index: 1;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* Glassmorphism card */
    .register-card {
      position: relative;
      width: 420px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      z-index: 2;
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .register-card h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 25px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 15px #a8ff78;
    }

    .input-group i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 18px;
      opacity: 0.8;
    }

    /* Error messages */
    .error-message {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 5px;
      text-align: left;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 10px;
      border-radius: 5px;
      display: none;
    }

    /* Glowing CTA button */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #43c6ac, #191654);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .btn:hover {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      box-shadow: 0 0 25px #ffd200, 0 0 50px #ffb347;
      transform: scale(1.05);
    }

    .footer-text {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #fff;
      opacity: 0.85;
    }
    .footer-text a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .footer-text a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #ffd700;
    }
    .quote {
      margin-top: 25px;
      font-size: 13px;
      text-align: center;
      color: #fefefe;
      font-style: italic;
      opacity: 0.9;
    }

    /* Messages styling */
    .messages {
      margin-bottom: 20px;
    }
    
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    .alert-error {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }
    
    .alert-success {
      background: rgba(67, 198, 172, 0.2);
      color: #43c6ac;
      border: 1px solid rgba(67, 198, 172, 0.3);
    }
  </style>
</head>
<body>
  <!-- Falling leaves -->
  <script>
    for(let i=0; i<15; i++){
      let leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.style.left = Math.random()*100 + 'vw';
      leaf.style.animationDuration = (Math.random()*5 + 5) + 's';
      leaf.style.animationDelay = (Math.random()*5) + 's';
      document.body.appendChild(leaf);
    }
  </script>

  <!-- Register Form -->
  <div class="register-card">
    <h2>🌱 Create Your Account</h2>
    
    <!-- Display Messages -->
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
    {% endif %}
    
    <form method="POST">
      {% csrf_token %}
      
      <div class="input-group">
        <input type="text" name="username" placeholder="Username" required>
        <i class="fa fa-user"></i>
        <div class="error-message" id="username-error"></div>
      </div>
      
      <div class="input-group">
        <input type="email" name="email" placeholder="Email Address" required>
        <i class="fa fa-envelope"></i>
        <div class="error-message" id="email-error"></div>
      </div>
      
      <div class="input-group">
        <input type="password" name="password1" placeholder="Password" required>
        <i class="fa fa-lock"></i>
        <div class="error-message" id="password1-error"></div>
      </div>
      
      <div class="input-group">
        <input type="password" name="password2" placeholder="Confirm Password" required>
        <i class="fa fa-lock"></i>
        <div class="error-message" id="password2-error"></div>
      </div>
      
      <button type="submit" class="btn">🌄 Start Growing With Us</button>
    </form>
    
    <div class="footer-text">
      Already have an account? <a href="{% url 'planner:login' %}">Login here</a>
    </div>
    
    <div class="quote">
      "Every farmer was once a beginner — welcome to your journey with FarmBright." 🌾
    </div>
  </div>

  <!-- Form Validation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.querySelector('form');
      
      form.addEventListener('submit', function(e) {
        let isValid = true;
        
        // Clear previous errors
        document.querySelectorAll('.error-message').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        
        // Validate username
        const username = document.querySelector('input[name="username"]');
        if (username.value.length < 3) {
          showError('username-error', 'Username must be at least 3 characters long');
          isValid = false;
        }
        
        // Validate email
        const email = document.querySelector('input[name="email"]');
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email.value)) {
          showError('email-error', 'Please enter a valid email address');
          isValid = false;
        }
        
        // Validate password
        const password1 = document.querySelector('input[name="password1"]');
        if (password1.value.length < 8) {
          showError('password1-error', 'Password must be at least 8 characters long');
          isValid = false;
        }
        
        // Validate password confirmation
        const password2 = document.querySelector('input[name="password2"]');
        if (password1.value !== password2.value) {
          showError('password2-error', 'Passwords do not match');
          isValid = false;
        }
        
        if (!isValid) {
          e.preventDefault();
        }
      });
      
      function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        errorElement.textContent = message;
        errorElement.style.display = 'block';
      }
    });
  </script>
</body>
</html>
